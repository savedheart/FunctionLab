<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FunctionLab logo">
  <defs>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6655ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#e66bff"/>
    </linearGradient>
    <radialGradient id="node" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e4c7ff"/>
      <stop offset="45%" stop-color="#a875ff"/>
      <stop offset="100%" stop-color="#6a4dff"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- transparent background -->

  <!-- subtle coordinate axes -->
  <g opacity=".22" stroke="#a98cff" stroke-width="5" stroke-linecap="round">
    <path d="M70 256 H442"/>
    <path d="M256 82 V430"/>
  </g>

  <!-- soft wave glow -->
  <path
    d="M86 350
       C135 345 137 165 214 150
       C288 136 270 363 337 368
       C392 372 393 230 426 196"
    fill="none"
    stroke="#9b5cff"
    stroke-width="38"
    stroke-linecap="round"
    opacity=".18"
    filter="url(#glow)"
  />

  <!-- main ribbon -->
  <path
    d="M86 350
       C135 345 137 165 214 150
       C288 136 270 363 337 368
       C392 372 393 230 426 196"
    fill="none"
    stroke="url(#wave)"
    stroke-width="28"
    stroke-linecap="round"
  />

  <!-- highlight -->
  <path
    d="M91 343
       C140 333 143 178 215 163
       C276 151 266 349 334 355
       C386 360 389 239 420 205"
    fill="none"
    stroke="#d6b9ff"
    stroke-width="5"
    stroke-linecap="round"
    opacity=".38"
  />

  <!-- end nodes -->
  <circle cx="86" cy="350" r="28" fill="url(#node)" filter="url(#glow)"/>
  <circle cx="426" cy="196" r="28" fill="url(#node)" filter="url(#glow)"/>
  <circle cx="79" cy="343" r="7" fill="#f1ddff" opacity=".7"/>
  <circle cx="419" cy="189" r="7" fill="#f1ddff" opacity=".7"/>
</svg>
